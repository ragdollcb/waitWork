-- 统计周期：2026-08-01 至 2026-08-31；对照周期：2026-07\r
-- 口径：已完成订单、审核通过退款、按客户所属区域及渠道归集。\r
-- 金额源字段使用分，展示时统一换算为元并保留两位小数。\r
-- 单文件分析快照：下方 VALUES 为本次查询使用的脱敏样例数据。\r
-- SQL dialect: SQLite 3.25+ (CTE / window functions)\r
\r
WITH\r
report_params AS (\r
    SELECT\r
        '2026-08-01' AS period_start,\r
        '2026-09-01' AS period_end,\r
        '2026-07-01' AS baseline_start\r
),\r
\r
-- 对账已审核退款，避免订单关联后发生金额倍增\r
approved_refunds AS (\r
    SELECT\r
        order_id,\r
        COUNT(*) AS refund_events,\r
        SUM(refund_cents) AS refund_cents\r
    FROM fact_refunds\r
    WHERE review_status = 'approved'\r
    GROUP BY order_id\r
),\r
\r
-- 订单清洗：限定报告与对照月份，剔除取消订单\r
eligible_orders AS (\r
    SELECT\r
        o.order_id,\r
        o.customer_id,\r
        o.paid_at,\r
        o.paid_cents,\r
        o.coupon_cents,\r
        COALESCE(r.refund_cents, 0) AS refund_cents,\r
        CASE WHEN r.order_id IS NOT NULL THEN 1 ELSE 0 END AS is_refunded,\r
        CASE\r
            WHEN o.paid_at >= p.period_start THEN 'current'\r
            ELSE 'baseline'\r
        END AS period_type\r
    FROM fact_orders AS o\r
    CROSS JOIN report_params AS p\r
    LEFT JOIN approved_refunds AS r ON r.order_id = o.order_id\r
    WHERE o.order_status = 'completed'\r
      AND o.paid_at >= p.baseline_start\r
      AND o.paid_at < p.period_end\r
      AND o.paid_cents > 0\r
),\r
\r
-- 归集经营维度，计算扣除退款后的净收入\r
order_dimensions AS (\r
    SELECT\r
        o.*,\r
        c.region_name,\r
        c.channel_name,\r
        c.customer_type,\r
        c.registered_at,\r
        o.paid_cents - o.refund_cents AS net_cents\r
    FROM eligible_orders AS o\r
    INNER JOIN dim_customers AS c ON c.customer_id = o.customer_id\r
),\r
\r
-- 当月客户粒度：为去重买家数、复购买家数提供依据\r
current_customer_metrics AS (\r
    SELECT\r
        region_name,\r
        channel_name,\r
        customer_id,\r
        COUNT(*) AS order_count,\r
        SUM(paid_cents) AS paid_cents,\r
        SUM(refund_cents) AS refund_cents,\r
        SUM(net_cents) AS net_cents,\r
        SUM(is_refunded) AS refund_orders,\r
        SUM(coupon_cents) AS coupon_cents,\r
        MAX(CASE WHEN customer_type = '企业' THEN 1 ELSE 0 END) AS is_enterprise,\r
        MAX(CASE WHEN registered_at >= p.period_start THEN 1 ELSE 0 END) AS is_new_customer\r
    FROM order_dimensions\r
    CROSS JOIN report_params AS p\r
    WHERE period_type = 'current'\r
    GROUP BY region_name, channel_name, customer_id\r
),\r
\r
-- 区域 × 渠道的本期经营汇总\r
current_summary AS (\r
    SELECT\r
        region_name,\r
        channel_name,\r
        SUM(order_count) AS paid_orders,\r
        COUNT(*) AS active_buyers,\r
        SUM(CASE WHEN order_count >= 2 THEN 1 ELSE 0 END) AS repeat_buyers,\r
        SUM(is_new_customer) AS new_buyers,\r
        SUM(is_enterprise) AS enterprise_buyers,\r
        SUM(paid_cents) AS paid_cents,\r
        SUM(refund_cents) AS refund_cents,\r
        SUM(net_cents) AS net_cents,\r
        SUM(refund_orders) AS refund_orders,\r
        SUM(coupon_cents) AS coupon_cents\r
    FROM current_customer_metrics\r
    GROUP BY region_name, channel_name\r
),\r
\r
-- 对照期采用完全相同的订单及退款口径\r
baseline_summary AS (\r
    SELECT\r
        region_name,\r
        channel_name,\r
        COUNT(*) AS baseline_orders,\r
        COUNT(DISTINCT customer_id) AS baseline_buyers,\r
        SUM(net_cents) AS baseline_net_cents\r
    FROM order_dimensions\r
    WHERE period_type = 'baseline'\r
    GROUP BY region_name, channel_name\r
),\r
\r
-- 补齐零交易分组，保证报告维度稳定\r
dimension_grid AS (\r
    SELECT DISTINCT region_name, channel_name\r
    FROM dim_customers\r
),\r
report_base AS (\r
    SELECT\r
        g.region_name,\r
        g.channel_name,\r
        COALESCE(c.paid_orders, 0) AS paid_orders,\r
        COALESCE(c.active_buyers, 0) AS active_buyers,\r
        COALESCE(c.repeat_buyers, 0) AS repeat_buyers,\r
        COALESCE(c.new_buyers, 0) AS new_buyers,\r
        COALESCE(c.enterprise_buyers, 0) AS enterprise_buyers,\r
        COALESCE(c.paid_cents, 0) AS paid_cents,\r
        COALESCE(c.refund_cents, 0) AS refund_cents,\r
        COALESCE(c.net_cents, 0) AS net_cents,\r
        COALESCE(c.refund_orders, 0) AS refund_orders,\r
        COALESCE(c.coupon_cents, 0) AS coupon_cents,\r
        COALESCE(b.baseline_orders, 0) AS baseline_orders,\r
        COALESCE(b.baseline_buyers, 0) AS baseline_buyers,\r
        COALESCE(b.baseline_net_cents, 0) AS baseline_net_cents\r
    FROM dimension_grid AS g\r
    LEFT JOIN current_summary AS c\r
        ON c.region_name = g.region_name\r
       AND c.channel_name = g.channel_name\r
    LEFT JOIN baseline_summary AS b\r
        ON b.region_name = g.region_name\r
       AND b.channel_name = g.channel_name\r
),\r
\r
-- 派生指标：客单价、退款率、复购率、净收入环比\r
report_metrics AS (\r
    SELECT\r
        *,\r
        ROUND(paid_cents / 100.0, 2) AS paid_amount,\r
        ROUND(refund_cents / 100.0, 2) AS refund_amount,\r
        ROUND(net_cents / 100.0, 2) AS net_revenue,\r
        ROUND(net_cents / 100.0 / NULLIF(paid_orders, 0), 2) AS avg_order_value,\r
        ROUND(100.0 * refund_orders / NULLIF(paid_orders, 0), 2) AS refund_rate_pct,\r
        ROUND(100.0 * repeat_buyers / NULLIF(active_buyers, 0), 2) AS repeat_rate_pct,\r
        ROUND(100.0 * (net_cents - baseline_net_cents) / NULLIF(baseline_net_cents, 0), 2) AS mom_growth_pct\r
    FROM report_base\r
),\r
\r
-- 窗口分析：全局贡献率、区域内排序、累计收入占比\r
ranked_report AS (\r
    SELECT\r
        *,\r
        DENSE_RANK() OVER (\r
            ORDER BY net_cents DESC\r
        ) AS revenue_rank,\r
        ROW_NUMBER() OVER (\r
            PARTITION BY region_name\r
            ORDER BY net_cents DESC, channel_name\r
        ) AS region_rank,\r
        ROUND(100.0 * net_cents / NULLIF(SUM(net_cents) OVER (), 0), 2) AS revenue_share_pct,\r
        ROUND(\r
            100.0 * SUM(net_cents) OVER (\r
                ORDER BY net_cents DESC, region_name, channel_name\r
                ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\r
            ) / NULLIF(SUM(net_cents) OVER (), 0),\r
            2\r
        ) AS cumulative_share_pct\r
    FROM report_metrics\r
),\r

-- 客户维度：地区、获客渠道、客户类型和注册日期\r

林照回到小镇的时候，雨刚好落下来。

车站还是记忆里的样子，蓝色的站牌褪成了浅灰，雨棚边缘长着一小片青苔。她站在屋檐下，把行李箱往身边拉了拉。最后一班公交车拐过街角，车尾的灯在水洼里留下两道短短的红线。

街对面，那家开了很多年的书店竟然还亮着灯。

门上的铜铃响了一声。柜台后面的人抬起头，像是早就知道她会来一样，指了指窗边的椅子。

“雨还得下一会儿。”老人说。

林照没有解释自己只是进来躲雨。她在窗边坐下，看见桌上放着一本没有封面的书，书页里夹着一张车票。日期是十七年前的今天。

她的手停在半空。那一年，她离开小镇时，也买过这样一张票。

窗玻璃上的水珠缓缓滑下来，把街灯拉成弯弯曲曲的细线。店里有纸张和旧木头的气味，还有一壶刚烧开的茶。她忽然觉得，过去的许多年像一段被折起来的纸，此刻正在慢慢展开。

“这是谁的书？”她问。

老人把茶放到桌上。“等人的书。”

第二章 夹在书里的信

车票背面写着一个地址，字迹很轻，像是怕写得太用力，就会改变什么。

林照翻开下一页。一封信从书脊旁滑下来，落在桌面。信封没有粘住，也没有收件人的名字。她看了一眼老人，他只是在整理柜台上的书，没有阻止她。

“如果你今天回来，就替我去看看河边的那棵树。”

信里只有这一句话。

她记得那棵树。夏天的时候，他们会在树荫下写作业，纸页被风翻动，总得用一块石头压住。后来河岸修了步道，再后来她搬去了很远的城市。那棵树在她的记忆里一直没有长大。

雨声渐渐小了。老人从门后取下一把伞，放到她的行李箱旁边。

“不用急着还。”他说，“总会再下雨的。”

林照把信折好，放回书中。她没有再追问是谁留下的。有些答案，也许要走过一段路才能知道。

第三章 天光

河边的树还在，比记忆里高了许多。

树下新添了一张长椅，椅背上有一块小小的铜牌。林照弯下腰，擦去上面的雨水，看清了那行字：献给每一个回来的人。

她坐下来，把伞靠在椅边。

河水向东流去。对岸有人推着自行车慢慢走过，车篮里露出一把绿色的葱。远处传来饭菜下锅的声音，像是小镇在用最平常的方式迎接黄昏。

手机亮了一下，是同事问她什么时候回去。她想了想，回复说，再过几天。

雨已经停了。

云层裂开一道窄窄的缝，天光落到书页上。林照拿出一支笔，在那封信的背面写道：我看过了，它长得很好。

她合上书，第一次觉得，自己是真的回来了。
