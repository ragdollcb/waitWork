name: Build Wait Work packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: waitwork-packages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
            arch: x64
          - runner: windows-11-arm
            target: windows-arm64
            arch: arm64
          - runner: macos-15-intel
            target: darwin-x64
            arch: x64
          - runner: macos-15
            target: darwin-arm64
            arch: arm64
          - runner: ubuntu-22.04
            target: linux-x64
            arch: x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
            arch: arm64
    env:
      CGO_ENABLED: '0'
      DBX_PLUGIN_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          architecture: ${{ matrix.arch }}
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - name: Check version and native platform
        run: npm run release:check
      - name: Test frontend logic and backend
        run: |
          npm test
          npm run test:backend
      - name: Build UI and check project
        run: |
          npm run build
          node .agents/skills/dbx-plugin/scripts/check-project.mjs .
      - name: Package and verify unsigned candidate
        run: |
          npx --no-install dbx-plugin package . --target "$DBX_PLUGIN_TARGET" --output-dir dist/release
          node scripts/release.mjs verify dist/release "$DBX_PLUGIN_TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/release/*.dbxp
            dist/release/*.artifact.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  bundle:
    name: Verify all six packages
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist/release
          merge-multiple: true
      - name: Verify packages and generate release-candidates.json
        run: |
          npm run release:collect
          cp docs/release-notes.md dist/release/RELEASE_NOTES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waitwork-all-platforms
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  draft-release:
    name: Create release draft
    needs: bundle
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'ragdollcb/waitWork'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: waitwork-all-platforms
          path: dist/release
      # 不覆盖同版本 Release；先把全部包上传到草稿，检查后再手动发布。
      - name: Create draft with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/release/*.dbxp dist/release/*.artifact.json dist/release/release-candidates.json \
            --verify-tag --draft --title "Wait Work $RELEASE_TAG" \
            --notes-file dist/release/RELEASE_NOTES.md
